name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  repository: read

env:
  # Fall back on any proxy error so hosted runners are not tied to one endpoint.
  GOPROXY: "https://goproxy.cn|https://mirrors.aliyun.com/goproxy/|direct"

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: [codearts-hosted, ubuntu-latest, x64, small]
    steps:
      - name: Checkout
        uses: checkout

      - name: Set up Go
        uses: setup-go
        with:
          version: "1.22"

      - name: Run golangci-lint
        run: >-
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          run --disable=errcheck --disable=staticcheck

  security:
    name: Secret Scan
    runs-on: [codearts-hosted, ubuntu-latest, x64, small]
    steps:
      - name: Checkout
        uses: checkout

      - name: Set up Go
        uses: setup-go
        with:
          version: "1.22"

      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@latest
        env:
          GOTOOLCHAIN: auto

      - name: Run gitleaks
        run: gitleaks detect --source . --redact=100 --verbose --exit-code 1 --config .gitleaks.toml

  test:
    name: Test
    runs-on: [codearts-hosted, ubuntu-latest, x64, small]
    steps:
      - name: Checkout
        uses: checkout

      - name: Set up Go
        uses: setup-go
        with:
          version: "1.22"

      - name: Set up Node
        uses: setup-node
        with:
          node-version: "22"

      - name: Validate release version script
        run: |
          bash scripts/test-release-version-validation.sh
          bash scripts/sync-package-version.sh "$(cat VERSION)" --check

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Run npm wrapper tests
        run: npm test --prefix npm

      - name: Resolve coverage artifact name
        id: coverage-artifact
        run: echo "name=coverage-linux-${ATOMGIT_RUN_ID:?}" >> "$ATOMGIT_OUTPUT"

      - name: Upload coverage
        uses: upload-artifact
        with:
          name: ${{ steps.coverage-artifact.outputs.name }}
          path: coverage.out
          retention-days: 7

  build:
    name: Build
    runs-on: [codearts-hosted, ubuntu-latest, x64, small]
    needs:
      - test
    steps:
      - name: Checkout
        uses: checkout

      - name: Set up Go
        uses: setup-go
        with:
          version: "1.22"

      - name: Build
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"
          mkdir -p bin
          go build -ldflags "${LDFLAGS}" -o bin/gc ./cmd/gc
          bin/gc version

      - name: Resolve binary artifact name
        id: binary-artifact
        run: echo "name=gc-ubuntu-${ATOMGIT_RUN_ID:?}" >> "$ATOMGIT_OUTPUT"

      - name: Upload binary
        uses: upload-artifact
        with:
          name: ${{ steps.binary-artifact.outputs.name }}
          path: bin/gc
          retention-days: 7

  package:
    name: Package
    runs-on: [codearts-hosted, ubuntu-latest, x64, small]
    needs:
      - test
    steps:
      - name: Checkout
        uses: checkout

      - name: Set up Go
        uses: setup-go
        with:
          version: "1.22"

      - name: Set up Python
        uses: setup-python
        with:
          python-version: "3.12"

      - name: Generate completions
        run: |
          go build -o /tmp/gc ./cmd/gc
          mkdir -p completions
          /tmp/gc completion bash > completions/gc.bash
          /tmp/gc completion zsh > completions/gc.zsh
          /tmp/gc completion fish > completions/gc.fish

      - name: Build binary
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o gc ./cmd/gc
          mkdir -p gc_cli/bin
          cp gc gc_cli/bin/gc-linux-amd64

      - name: Wheel entrypoint smoke test
        run: |
          set -euo pipefail
          export PIP_BREAK_SYSTEM_PACKAGES=1
          command -v python || python() { python3 "$@"; }
          python -m pip install build
          python -m build --wheel --outdir dist/
          python -m pip install dist/*.whl
          echo "=== gc version ===" && gc version
          echo "=== gitcode version ===" && gitcode version
          echo "=== python -m gc_cli version ===" && python -m gc_cli version

      - name: Resolve wheel artifact name
        id: wheel-artifact
        run: echo "name=gc-wheel-${ATOMGIT_RUN_ID:?}" >> "$ATOMGIT_OUTPUT"

      - name: Upload wheel
        uses: upload-artifact
        with:
          name: ${{ steps.wheel-artifact.outputs.name }}
          path: dist/*.whl
          retention-days: 7
