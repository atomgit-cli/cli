name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.22'

      - uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.12.2
          args: --disable=errcheck --disable=staticcheck

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.22'

      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
        env:
          GOTOOLCHAIN: auto

      - name: Run gitleaks
        run: gitleaks detect --source . --redact=100 --verbose --exit-code 1 --config .gitleaks.toml

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.22'

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Validate release version script
        shell: bash
        run: |
          bash scripts/test-release-version-validation.sh
          bash scripts/sync-package-version.sh "$(cat VERSION)" --check
          bash scripts/sync-docs-version.sh "$(cat VERSION)" --check

      - name: Validate docs version sync script
        # The sync mode relies on GNU sed -E -i (capture-group backwrites),
        # so it is exercised on Linux only; --check above is plain grep and
        # runs on every platform.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/test-sync-docs-version.sh

      - name: Download dependencies
        run: go mod download

      - name: Validate host setup contract (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/test-dev-setup.sh

      - name: Validate host setup contract (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-dev-setup.ps1

      - name: Run tests
        shell: bash
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Run npm wrapper and real-upgrade tests
        # bash -e fails the step on the first failing command; the default
        # pwsh on Windows only surfaces the last command's exit code, which
        # masked npm test failures (run 35840605182).
        shell: bash
        run: |
          npm test --prefix npm
          npm run test:upgrade --prefix npm

      - name: Run Python wrapper tests
        # The gc_cli wrapper (uv/pypi channel detection, binary resolution)
        # is otherwise only covered by the wheel smoke test.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: python3 -m unittest tests.test_wrapper -v

      - name: Check completions and generated package assets for drift
        # build/ holds generated copies (gitcode completions, deb/rpm
        # postinstall) consumed by nfpm; when scripts/ or completions/
        # change without regenerating them, the release preflight fails.
        # Catch the drift here, at PR time. The completions themselves are
        # regenerated from a fresh build first: prepare-package-assets.sh
        # only transforms the committed completions/, so a stale
        # completions/ commit would otherwise pass CI and only fail at
        # release preflight.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          go build -o /tmp/gc ./cmd/gc
          mkdir -p completions
          /tmp/gc completion bash > completions/gc.bash
          /tmp/gc completion zsh > completions/gc.zsh
          /tmp/gc completion fish > completions/gc.fish
          bash scripts/prepare-package-assets.sh
          git diff --exit-code completions/ build/

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@8cad3ba95e5920c42f44492e54bc9639cba47959 # v6.0.2
        with:
          files: ./coverage.out
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    needs: [test]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.22'

      - name: Build
        shell: bash
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # macOS: drop -s to preserve LC_UUID (dyld requires it)
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            STRIP_FLAGS="-w"
          else
            STRIP_FLAGS="-s -w"
          fi
          LDFLAGS="${STRIP_FLAGS} -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"
          mkdir -p bin
          go build -ldflags "${LDFLAGS}" -o bin/gc ./cmd/gc
          bin/gc version

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: gc-${{ matrix.os }}
          path: bin/gc
          retention-days: 7

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.22'

      - name: Generate completions
        run: |
          go build -o /tmp/gc ./cmd/gc
          mkdir -p completions
          /tmp/gc completion bash > completions/gc.bash
          /tmp/gc completion zsh > completions/gc.zsh
          /tmp/gc completion fish > completions/gc.fish

      - name: Build binary
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o gc ./cmd/gc
          mkdir -p gc_cli/bin
          cp gc gc_cli/bin/gc-linux-amd64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: false
          tags: gitcode/gc:latest
          platforms: linux/amd64

      - name: Wheel entrypoint smoke test
        run: |
          set -euo pipefail
          pip install build==1.4.1
          python -m build --wheel --outdir dist/
          pip install dist/*.whl
          echo "=== gc version ===" && gc version
          echo "=== gitcode version ===" && gitcode version
          echo "=== python -m gc_cli version ===" && python -m gc_cli version
