name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version with required v prefix (e.g., v1.0.0 or v1.0.0-rc.1)'
        required: true
        type: string
      npm_recovery:
        description: 'Publish only the verified npm asset from an existing GitHub Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    if: ${{ !inputs.npm_recovery }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.VERSION_TAG }}
      package_version: ${{ steps.version.outputs.VERSION_NUM }}
      head_sha: ${{ steps.version.outputs.HEAD_SHA }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.22.12'

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.9'

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate version input
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main"
          VERSION_NUM="$(./scripts/validate-release-version.sh "${VERSION_INPUT}")"
          VERSION_TAG="v${VERSION_NUM}"
          test "${VERSION_INPUT}" = "${VERSION_TAG}"
          echo "VERSION_TAG=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "VERSION_NUM=${VERSION_NUM}" >> "$GITHUB_OUTPUT"
          echo "HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate release notes
        env:
          VERSION_TAG: ${{ steps.version.outputs.VERSION_TAG }}
        run: test -f "docs/releases/${VERSION_TAG}.md"

      - name: Generate completions and package assets
        run: |
          set -euo pipefail
          go build -o /tmp/gc ./cmd/gc
          mkdir -p completions
          /tmp/gc completion bash > completions/gc.bash
          /tmp/gc completion zsh > completions/gc.zsh
          /tmp/gc completion fish > completions/gc.fish
          bash scripts/prepare-package-assets.sh

      - name: Validate release tree
        run: |
          set -euo pipefail
          go mod tidy
          go generate ./...
          git diff --exit-code

      - name: Sync preflight versions
        env:
          VERSION_NUM: ${{ steps.version.outputs.VERSION_NUM }}
        run: |
          set -euo pipefail
          bash scripts/sync-package-version.sh "${VERSION_NUM}" --check

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3

      - name: Preflight GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: 'v2.17.1'
          args: release --snapshot --clean --skip=publish

      - name: Preflight packages and wheel
        run: |
          set -euo pipefail
          extract_gc() {
            archive="$1"
            target="$2"
            temp_dir="$(mktemp -d)"
            tar -xzf "${archive}" -C "${temp_dir}"
            mv "${temp_dir}/gc" "${target}"
            rm -rf "${temp_dir}"
          }

          extract_gc dist/gc_*_linux_amd64.tar.gz dist/gc_linux_amd64
          extract_gc dist/gc_*_linux_arm64.tar.gz dist/gc_linux_arm64
          ~/go/bin/nfpm package -f nfpm-amd64.yaml -p deb -t dist
          ~/go/bin/nfpm package -f nfpm-amd64.yaml -p rpm -t dist
          ~/go/bin/nfpm package -f nfpm-arm64.yaml -p deb -t dist
          ~/go/bin/nfpm package -f nfpm-arm64.yaml -p rpm -t dist

          mkdir -p gc_cli/bin
          cp dist/gc_linux_amd64 gc_cli/bin/gc-linux-amd64
          cp dist/gc_linux_arm64 gc_cli/bin/gc-linux-arm64
          extract_gc dist/gc_*_darwin_amd64.tar.gz gc_cli/bin/gc-darwin-amd64
          extract_gc dist/gc_*_darwin_arm64.tar.gz gc_cli/bin/gc-darwin-arm64
          unzip -p dist/gc_*_windows_amd64.zip gc.exe > gc_cli/bin/gc-windows-amd64.exe

          python -m venv /tmp/gc-build-venv
          /tmp/gc-build-venv/bin/pip install build==1.4.1
          /tmp/gc-build-venv/bin/python -m build --wheel --sdist --outdir dist
          python -m venv /tmp/gc-release-venv
          /tmp/gc-release-venv/bin/pip install dist/*.whl
          /tmp/gc-release-venv/bin/gitcode version --json
          /tmp/gc-release-venv/bin/gc version --json
          /tmp/gc-release-venv/bin/python -m gc_cli version --json
          SNAPSHOT_VERSION="$(python -c 'import json; print(json.load(open("dist/metadata.json", encoding="utf-8"))["version"])')"
          test -n "${SNAPSHOT_VERSION}"
          bash scripts/prepare-npm-package.sh "${{ steps.version.outputs.VERSION_NUM }}" dist dist "${SNAPSHOT_VERSION}"

  tag:
    name: Tag
    runs-on: ubuntu-24.04
    needs: preflight
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push tag
        env:
          EXPECTED_HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          VERSION_TAG: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          test "${HEAD_SHA}" = "${EXPECTED_HEAD_SHA}"
          if git rev-parse --verify --quiet "refs/tags/${VERSION_TAG}" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "${VERSION_TAG}")"
            test "${TAG_SHA}" = "${HEAD_SHA}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${VERSION_TAG}" -m "Release ${VERSION_TAG}"
            git push origin "refs/tags/${VERSION_TAG}"
          fi

  artifacts:
    name: Artifacts
    runs-on: ubuntu-24.04
    needs: [preflight, tag]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.version }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.22.12'

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.9'

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify release tag
        env:
          EXPECTED_HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          VERSION_TAG: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          test "$(git rev-list -n 1 "${VERSION_TAG}")" = "${EXPECTED_HEAD_SHA}"

      - name: Generate package assets
        run: |
          set -euo pipefail
          go build -o /tmp/gc ./cmd/gc
          mkdir -p completions
          /tmp/gc completion bash > completions/gc.bash
          /tmp/gc completion zsh > completions/gc.zsh
          /tmp/gc completion fish > completions/gc.fish
          bash scripts/prepare-package-assets.sh
          git diff --exit-code

      - name: Build GoReleaser assets
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: 'v2.17.1'
          args: release --clean --skip=publish

      - name: Sync package versions
        env:
          VERSION_NUM: ${{ needs.preflight.outputs.package_version }}
        run: |
          set -euo pipefail
          bash scripts/sync-package-version.sh "${VERSION_NUM}" --check

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3

      - name: Build DEB/RPM and Python packages
        run: |
          set -euo pipefail
          extract_gc() {
            archive="$1"
            target="$2"
            temp_dir="$(mktemp -d)"
            tar -xzf "${archive}" -C "${temp_dir}"
            mv "${temp_dir}/gc" "${target}"
            rm -rf "${temp_dir}"
          }

          extract_gc dist/gc_*_linux_amd64.tar.gz dist/gc_linux_amd64
          extract_gc dist/gc_*_linux_arm64.tar.gz dist/gc_linux_arm64
          ~/go/bin/nfpm package -f nfpm-amd64.yaml -p deb -t dist
          ~/go/bin/nfpm package -f nfpm-amd64.yaml -p rpm -t dist
          ~/go/bin/nfpm package -f nfpm-arm64.yaml -p deb -t dist
          ~/go/bin/nfpm package -f nfpm-arm64.yaml -p rpm -t dist

          mkdir -p gc_cli/bin
          cp dist/gc_linux_amd64 gc_cli/bin/gc-linux-amd64
          cp dist/gc_linux_arm64 gc_cli/bin/gc-linux-arm64
          extract_gc dist/gc_*_darwin_amd64.tar.gz gc_cli/bin/gc-darwin-amd64
          extract_gc dist/gc_*_darwin_arm64.tar.gz gc_cli/bin/gc-darwin-arm64
          unzip -p dist/gc_*_windows_amd64.zip gc.exe > gc_cli/bin/gc-windows-amd64.exe
          python -m venv /tmp/gc-build-venv
          /tmp/gc-build-venv/bin/pip install build==1.4.1
          /tmp/gc-build-venv/bin/python -m build --wheel --sdist --outdir dist
          bash scripts/prepare-npm-package.sh "${{ needs.preflight.outputs.package_version }}" dist dist

      - name: Verify release entry points
        run: |
          set -euo pipefail
          dist/gc_linux_amd64 version --json
          python -m venv /tmp/gc-release-venv
          /tmp/gc-release-venv/bin/pip install dist/*.whl
          /tmp/gc-release-venv/bin/gitcode version --json
          /tmp/gc-release-venv/bin/gc version --json
          /tmp/gc-release-venv/bin/python -m gc_cli version --json

      - name: Assemble release assets and checksums
        env:
          VERSION_NUM: ${{ needs.preflight.outputs.package_version }}
        run: |
          set -euo pipefail
          mkdir release-assets
          cp dist/gc_*_linux_amd64.tar.gz release-assets/
          cp dist/gc_*_linux_arm64.tar.gz release-assets/
          cp dist/gc_*_darwin_amd64.tar.gz release-assets/
          cp dist/gc_*_darwin_arm64.tar.gz release-assets/
          cp dist/gc_*_windows_amd64.zip release-assets/
          cp dist/*.deb dist/*.rpm release-assets/
          cp dist/gc_linux_amd64 dist/gc_linux_arm64 release-assets/
          cp dist/*.whl dist/gitcode_cli-*.tar.gz release-assets/
          cp dist/*.tgz release-assets/
          cd release-assets
          find . -maxdepth 1 -type f ! -name "gc_${VERSION_NUM}_checksums.txt" -printf '%f\0' \
            | sort -z | xargs -0 sha256sum > "gc_${VERSION_NUM}_checksums.txt"
          sha256sum -c "gc_${VERSION_NUM}_checksums.txt"

      - name: Upload release assets
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 90

      - name: Upload Homebrew formula
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: homebrew-formula
          path: dist/homebrew/*.rb
          if-no-files-found: error
          retention-days: 90

  publish:
    name: GitHub Release
    runs-on: ubuntu-24.04
    needs: [preflight, artifacts]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.version }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Verify and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NUM: ${{ needs.preflight.outputs.package_version }}
          VERSION_TAG: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c "gc_${VERSION_NUM}_checksums.txt"
          cd ..

          if gh release view "${VERSION_TAG}" >/dev/null 2>&1; then
            mkdir existing-release-assets
            gh release download "${VERSION_TAG}" --dir existing-release-assets
            diff -u \
              <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort) \
              <(find existing-release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
            cmp \
              "release-assets/gc_${VERSION_NUM}_checksums.txt" \
              "existing-release-assets/gc_${VERSION_NUM}_checksums.txt"
            (
              cd existing-release-assets
              sha256sum -c "gc_${VERSION_NUM}_checksums.txt"
            )
            gh release edit "${VERSION_TAG}" \
              --title "GitCode CLI ${VERSION_TAG}" \
              --notes-file "docs/releases/${VERSION_TAG}.md"
          else
            release_args=(
              "${VERSION_TAG}"
              --verify-tag
              --title "GitCode CLI ${VERSION_TAG}"
              --notes-file "docs/releases/${VERSION_TAG}.md"
            )
            if [[ "${VERSION_NUM}" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "${release_args[@]}" release-assets/*
          fi

  pypi:
    name: PyPI
    runs-on: ubuntu-24.04
    needs: [preflight, publish]
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Select Python distributions
        run: |
          set -euo pipefail
          mkdir dist
          cp release-assets/*.whl release-assets/gitcode_cli-*.tar.gz dist/

      - name: Verify any existing PyPI distributions
        env:
          VERSION_NUM: ${{ needs.preflight.outputs.package_version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import urlopen

          version = os.environ["VERSION_NUM"]
          try:
              with urlopen(f"https://pypi.org/pypi/gitcode-cli/{version}/json") as response:
                  release = json.load(response)
          except HTTPError as error:
              if error.code == 404:
                  raise SystemExit(0)
              raise

          local = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in Path("dist").iterdir()
              if path.is_file()
          }
          remote = {
              item["filename"]: item["digests"]["sha256"]
              for item in release["urls"]
          }
          unexpected = sorted(remote.keys() - local.keys())
          mismatched = sorted(
              name for name in remote.keys() & local.keys()
              if remote[name] != local[name]
          )
          if unexpected or mismatched:
              raise SystemExit(
                  f"existing PyPI distributions differ: unexpected={unexpected}, mismatched={mismatched}"
              )
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true

  brew:
    name: Homebrew tap
    runs-on: ubuntu-24.04
    needs: [preflight, artifacts, publish]
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-formula
          path: formula

      - name: Push formula to tap repository
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          VERSION_TAG: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          test -n "${HOMEBREW_TAP_DEPLOY_KEY}" || { echo "::error::HOMEBREW_TAP_DEPLOY_KEY secret is missing"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "github.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOMqqnkVzqKEHvnCg2BRkOjFMiQ24aN3n5j0JpnewHSk" > ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add - <<< "${HOMEBREW_TAP_DEPLOY_KEY}"
          git clone git@github.com:atomgit-cli/homebrew-tap.git /tmp/tap
          cp formula/gc.rb /tmp/tap/gc.rb
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gc.rb
          if git diff --quiet --cached; then
            echo "no formula changes to push"
            exit 0
          fi
          git commit -m "chore: update gc formula for ${VERSION_TAG}"
          git pull --rebase origin main
          git push origin main

  npm:
    name: npm
    runs-on: ubuntu-24.04
    needs: [preflight, publish]
    permissions:
      contents: read
      id-token: write  # OIDC trusted publishing; no NPM_TOKEN needed
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never cache in release builds

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets

      - name: Verify release package and checksums
        env:
          VERSION_NUM: ${{ needs.preflight.outputs.package_version }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c "gc_${VERSION_NUM}_checksums.txt"
          test "$(find . -maxdepth 1 -name '*.tgz' -type f | wc -l)" -eq 3
          test -f "gitcode-cli-cli-${VERSION_NUM}.tgz"
          test -f "atomgit-cli-cli-${VERSION_NUM}.tgz"
          test -f "atomgit-cli-${VERSION_NUM}.tgz"

      - name: Publish to npm (OIDC trusted publishing)
        env:
          VERSION_NUM: ${{ needs.preflight.outputs.package_version }}
        run: |
          set -euo pipefail
          PUBLISH_TAG="latest"
          if [[ "${VERSION_NUM}" == *-* ]]; then
            PUBLISH_TAG="next"
          fi
          coordinate_tarball() {
            case "$1" in
              "@gitcode-cli/cli") printf 'gitcode-cli-cli-%s.tgz' "${VERSION_NUM}" ;;
              "@atomgit-cli/cli") printf 'atomgit-cli-cli-%s.tgz' "${VERSION_NUM}" ;;
              "atomgit-cli") printf 'atomgit-cli-%s.tgz' "${VERSION_NUM}" ;;
              *) return 1 ;;
            esac
          }
          for COORDINATE in "@gitcode-cli/cli" "@atomgit-cli/cli" "atomgit-cli"; do
            # Absolute path: a relative path with slashes makes npm treat the
            # tarball argument as a git shorthand spec instead of a file.
            PACKAGE_FILE="$(realpath "release-assets/$(coordinate_tarball "${COORDINATE}")")"
            test -f "${PACKAGE_FILE}"
            if npm view "${COORDINATE}@${VERSION_NUM}" version >/dev/null 2>&1; then
              mkdir existing-npm
              npm pack "${COORDINATE}@${VERSION_NUM}" --pack-destination existing-npm >/dev/null
              EXISTING_FILE="$(find existing-npm -maxdepth 1 -name '*.tgz' -type f -print -quit)"
              test -n "${EXISTING_FILE}"
              test "$(sha256sum "${PACKAGE_FILE}" | cut -d' ' -f1)" = "$(sha256sum "${EXISTING_FILE}" | cut -d' ' -f1)" || {
                echo "::error::existing npm package content differs from the verified release asset (${COORDINATE})"
                exit 1
              }
              TAG_VERSION="$(npm view "${COORDINATE}" "dist-tags.${PUBLISH_TAG}")"
              test "${TAG_VERSION}" = "${VERSION_NUM}" || {
                echo "::error::npm dist-tag ${PUBLISH_TAG} for ${COORDINATE} points to ${TAG_VERSION}, expected ${VERSION_NUM}"
                exit 1
              }
              echo "npm ${COORDINATE}@${VERSION_NUM} already published with identical content; skipping"
              rm -rf existing-npm
              continue
            fi
            # OIDC: npm CLI auto-detects the id-token: write permission and the
            # trusted publisher configured on npmjs.com, exchanging a short-lived
            # token. No NPM_TOKEN secret is used; provenance is auto-generated.
            npm publish "${PACKAGE_FILE}" --access public --tag "${PUBLISH_TAG}"
          done
          # Long-term parallel distribution invariant (docs/PACKAGING.md): a
          # completed release must leave all three coordinates on the same
          # dist-tag version. Bounded retries absorb registry propagation
          # delay; a mismatch after the retries blocks the release.
          for COORDINATE in "@gitcode-cli/cli" "@atomgit-cli/cli" "atomgit-cli"; do
            for ATTEMPT in 1 2 3; do
              TAG_VERSION="$(npm view "${COORDINATE}" "dist-tags.${PUBLISH_TAG}")"
              if [[ "${TAG_VERSION}" = "${VERSION_NUM}" ]]; then
                break
              fi
              if [[ "${ATTEMPT}" -lt 3 ]]; then
                sleep 10
              fi
            done
            test "${TAG_VERSION}" = "${VERSION_NUM}" || {
              echo "::error::npm dist-tag ${PUBLISH_TAG} for ${COORDINATE} is ${TAG_VERSION}; all three coordinates must publish ${VERSION_NUM}"
              exit 1
            }
          done

  npm-recovery:
    name: npm recovery
    if: ${{ inputs.npm_recovery }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write  # Same trusted release.yml publisher identity; no NPM_TOKEN.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Validate and download existing release package
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main"
          VERSION_NUM="$(./scripts/validate-release-version.sh "${VERSION_INPUT}")"
          test "${VERSION_INPUT}" = "v${VERSION_NUM}"
          test "$(tr -d '\r\n' < VERSION)" = "${VERSION_NUM}"
          MANIFEST="docs/releases/${VERSION_INPUT}.npm-recovery.json"
          test -f "${MANIFEST}"
          TAG_SHA_EXPECTED="$(node -e 'const m=require("./"+process.argv[1]); process.stdout.write(m.tagCommit)' "${MANIFEST}")"
          TAG_TREE_EXPECTED="$(node -e 'const m=require("./"+process.argv[1]); process.stdout.write(m.tagTree)' "${MANIFEST}")"
          test "$(node -e 'const m=require("./"+process.argv[1]); process.stdout.write(m.version)' "${MANIFEST}")" = "${VERSION_NUM}"
          test "$(node -e 'const m=require("./"+process.argv[1]); process.stdout.write(m.tag)' "${MANIFEST}")" = "${VERSION_INPUT}"
          [[ "${TAG_SHA_EXPECTED}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${TAG_TREE_EXPECTED}" =~ ^[0-9a-f]{40}$ ]]
          git fetch --force --tags origin
          TAG_SHA="$(git rev-parse "${VERSION_INPUT}^{commit}")"
          test "${TAG_SHA}" = "${TAG_SHA_EXPECTED}"
          TAG_TREE="$(git rev-parse "${VERSION_INPUT}^{tree}")"
          test "${TAG_TREE}" = "${TAG_TREE_EXPECTED}"
          MAIN_TREES="$(git log --format=%T origin/main)"
          grep -Fxq "${TAG_TREE}" <<< "${MAIN_TREES}"
          test "$(git show "${VERSION_INPUT}:VERSION")" = "${VERSION_NUM}"
          test "$(gh release view "${VERSION_INPUT}" --json isDraft --jq .isDraft)" = "false"
          mkdir release-assets
          CHECKSUM_NAME="gc_${VERSION_NUM}_checksums.txt"
          # Manifest v2 carries a packages map (one entry per npm coordinate,
          # see docs/PACKAGING.md); v1 manifests carry a single @gitcode-cli/cli
          # package plus sha256 and stay recoverable unchanged.
          node - "${MANIFEST}" <<'NODE' > "${RUNNER_TEMP}/recovery-packages.tsv"
          const m = require("./" + process.argv[2]);
          const allowed = new Set(["@gitcode-cli/cli", "@atomgit-cli/cli", "atomgit-cli"]);
          const rows = [];
          if (m.packages && typeof m.packages === "object") {
            for (const [coordinate, entry] of Object.entries(m.packages)) {
              if (!allowed.has(coordinate)) throw new Error(`unsupported recovery coordinate: ${coordinate}`);
              if (!/^[0-9a-f]{64}$/.test(entry.sha256 || "")) throw new Error(`invalid sha256 for ${coordinate}`);
              if (!/^[A-Za-z0-9@._-]+\.tgz$/.test(entry.file || "")) throw new Error(`invalid tarball name for ${coordinate}`);
              rows.push([coordinate, entry.file, entry.sha256].join("\t"));
            }
            if (rows.length === 0) throw new Error("recovery manifest lists no packages");
          } else {
            if (m.package !== `gitcode-cli-cli-${m.version}.tgz`) {
              throw new Error("legacy manifest must reference the @gitcode-cli/cli tarball");
            }
            if (!/^[0-9a-f]{64}$/.test(m.sha256 || "")) throw new Error("invalid legacy sha256");
            rows.push(["@gitcode-cli/cli", m.package, m.sha256].join("\t"));
          }
          process.stdout.write(rows.join("\n") + "\n");
          NODE
          gh release download "${VERSION_INPUT}" \
            --pattern "*.tgz" \
            --pattern "${CHECKSUM_NAME}" \
            --dir release-assets
          test -f "release-assets/${CHECKSUM_NAME}"
          # Every tarball downloaded from the Release must be consumed by
          # exactly one manifest row; extras indicate a tampered or stale
          # release asset set.
          DOWNLOADED_TARBALLS="$(find release-assets -maxdepth 1 -name '*.tgz' -type f | wc -l)"
          test "${DOWNLOADED_TARBALLS}" -eq "$(wc -l < "${RUNNER_TEMP}/recovery-packages.tsv")"
          while IFS=$'\t' read -r COORDINATE PACKAGE_NAME PACKAGE_SHA_EXPECTED <&3; do
            test -f "release-assets/${PACKAGE_NAME}"
            test "$(grep -Fc "  ${PACKAGE_NAME}" "release-assets/${CHECKSUM_NAME}")" -eq 1
            CHECKSUM_LINE="$(grep -F "  ${PACKAGE_NAME}" "release-assets/${CHECKSUM_NAME}")"
            (cd release-assets && printf '%s\n' "${CHECKSUM_LINE}" | sha256sum -c -)
            ACTUAL_PACKAGE_SHA="$(sha256sum "release-assets/${PACKAGE_NAME}" | cut -d' ' -f1)"
            test "${ACTUAL_PACKAGE_SHA}" = "${PACKAGE_SHA_EXPECTED}"
            test "${CHECKSUM_LINE%% *}" = "${PACKAGE_SHA_EXPECTED}"
            PACKAGE_FILE="$(realpath "release-assets/${PACKAGE_NAME}")"
            tar -xOf "${PACKAGE_FILE}" package/package.json > "${RUNNER_TEMP}/npm-recovery-package.json"
            node - "${RUNNER_TEMP}/npm-recovery-package.json" "${VERSION_NUM}" "${COORDINATE}" <<'NODE'
          const pkg = require(process.argv[2]);
          const [version, coordinate] = process.argv.slice(3);
          const repositories = [
            "https://github.com/gitcode-cli/cli.git",
            "https://github.com/atomgit-cli/cli.git",
          ];
          if (pkg.name !== coordinate || pkg.version !== version ||
              !repositories.includes(pkg.repository?.url) ||
              pkg.repository?.directory !== "npm") {
            throw new Error("release tarball package metadata does not match the reviewed recovery manifest");
          }
          NODE
            tar -xOf "${PACKAGE_FILE}" package/bin/platforms/gc-linux-amd64 > "${RUNNER_TEMP}/gc-linux-amd64"
            chmod 0755 "${RUNNER_TEMP}/gc-linux-amd64"
            BINARY_INFO="$("${RUNNER_TEMP}/gc-linux-amd64" version --json)"
            node - "${BINARY_INFO}" "${VERSION_NUM}" "${TAG_SHA}" <<'NODE'
          const info = JSON.parse(process.argv[2]);
          if (info.version !== process.argv[3] || info.commit !== process.argv[4]) {
            throw new Error("embedded Linux binary version or commit does not match the reviewed tag");
          }
          NODE
          done 3< "${RUNNER_TEMP}/recovery-packages.tsv"
          echo "VERSION_NUM=${VERSION_NUM}" >> "$GITHUB_ENV"
          echo "RECOVERY_PACKAGES=${RUNNER_TEMP}/recovery-packages.tsv" >> "$GITHUB_ENV"

      - name: Recover npm publication (OIDC trusted publishing)
        run: |
          set -euo pipefail
          PUBLISH_TAG="latest"
          if [[ "${VERSION_NUM}" == *-* ]]; then
            PUBLISH_TAG="next"
          fi
          # Bounded retries absorb registry dist-tag propagation delay, which
          # already produced a false-negative recovery gate in v0.14.0.
          dist_tag_with_retry() {
            local coordinate="$1" attempt tag_version
            for attempt in 1 2 3; do
              tag_version="$(npm view "${coordinate}" "dist-tags.${PUBLISH_TAG}")"
              if [[ "${tag_version}" = "${VERSION_NUM}" ]]; then
                printf '%s' "${tag_version}"
                return 0
              fi
              if [[ "${attempt}" -lt 3 ]]; then
                sleep 10
              fi
            done
            printf '%s' "${tag_version}"
            return 1
          }
          while IFS=$'\t' read -r COORDINATE PACKAGE_NAME PACKAGE_SHA_EXPECTED <&3; do
            CURRENT_TAG_VERSION="$(npm view "${COORDINATE}" "dist-tags.${PUBLISH_TAG}" 2>/dev/null || true)"
            if [[ -n "${CURRENT_TAG_VERSION}" ]]; then
              node - "${VERSION_NUM}" "${CURRENT_TAG_VERSION}" <<'NODE'
          function parse(value) {
            const match = value.match(/^(\d+)\.(\d+)\.(\d+)(?:-(alpha|beta|rc)\.(\d+))?$/);
            if (!match) throw new Error(`unsupported release version: ${value}`);
            return [Number(match[1]), Number(match[2]), Number(match[3]), match[4] || null, Number(match[5] || 0)];
          }
          function compare(left, right) {
            for (let index = 0; index < 3; index += 1) {
              if (left[index] !== right[index]) return Math.sign(left[index] - right[index]);
            }
            if (left[3] === null || right[3] === null) return left[3] === right[3] ? 0 : (left[3] === null ? 1 : -1);
            const rank = {alpha: 0, beta: 1, rc: 2};
            return rank[left[3]] === rank[right[3]] ? Math.sign(left[4] - right[4]) : Math.sign(rank[left[3]] - rank[right[3]]);
          }
          if (compare(parse(process.argv[2]), parse(process.argv[3])) < 0) {
            throw new Error(`refusing to move npm dist-tag backwards from ${process.argv[3]} to ${process.argv[2]}`);
          }
          NODE
            fi
            PACKAGE_FILE="$(realpath "release-assets/${PACKAGE_NAME}")"
            if npm view "${COORDINATE}@${VERSION_NUM}" version >/dev/null 2>&1; then
              mkdir existing-npm
              npm pack "${COORDINATE}@${VERSION_NUM}" --pack-destination existing-npm >/dev/null
              EXISTING_FILE="$(find existing-npm -maxdepth 1 -name '*.tgz' -type f -print -quit)"
              test -n "${EXISTING_FILE}"
              test "$(sha256sum "${PACKAGE_FILE}" | cut -d' ' -f1)" = "$(sha256sum "${EXISTING_FILE}" | cut -d' ' -f1)" || {
                echo "::error::existing npm package content differs from the verified release asset (${COORDINATE})"
                exit 1
              }
              TAG_VERSION="$(dist_tag_with_retry "${COORDINATE}")"
              test "${TAG_VERSION}" = "${VERSION_NUM}"
              echo "npm ${COORDINATE}@${VERSION_NUM} already published with identical content; skipping"
              rm -rf existing-npm
              continue
            fi
            npm publish "${PACKAGE_FILE}" --access public --tag "${PUBLISH_TAG}"
          done 3< "${RECOVERY_PACKAGES}"
          # A full three-coordinate manifest must leave all coordinates aligned.
          if [[ "$(wc -l < "${RECOVERY_PACKAGES}")" -eq 3 ]]; then
            while IFS=$'\t' read -r COORDINATE _ _ <&3; do
              if ! TAG_VERSION="$(dist_tag_with_retry "${COORDINATE}")"; then
                echo "::error::npm dist-tag ${PUBLISH_TAG} for ${COORDINATE} is ${TAG_VERSION}; expected ${VERSION_NUM}"
                exit 1
              fi
            done 3< "${RECOVERY_PACKAGES}"
          fi
