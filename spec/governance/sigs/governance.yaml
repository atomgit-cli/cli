name: governance
display_name: Project Governance
status: incubating
created_at: 2026-09-14

leads:
  - "@aflyingto"

maintainers:
  - "@aflyingto"

# 参与本 SIG 的 Agent 列表（详见 spec/governance/sig-governance.md §4.3）
agents:
  - id: claude-code
    operator: "@aflyingto"
    scopes: []          # 空列表表示授权整个 SIG 范围
    since: 2026-09-14
  - id: trae-ai
    operator: "@aflyingto"
    scopes: []
    since: 2026-09-14

scope:
  - spec/
  - docs/
  - AGENTS.md
  - CLAUDE.md
  - CONTRIBUTING.md

labels:
  - sig/governance

# 活跃度统计映射的 scope/* label（见 sig-governance.md §3 统计口径与 §6.1；
# 未被映射的 scope/* 不计入本 SIG 活跃度）
scope_labels:
  - scope/governance
  - scope/docs

# Phase 1 未开通（平台 repo 级 discussion 分类能力未验证，见 sig-governance.md §6.2），保留为规划值
discussion_category: "SIG: Governance"

charter: |
  负责仓库治理与规范演进：
  - spec/ 目录结构、文档分层、真相源矩阵的维护
  - docs/ 与 spec/ 的边界与同步规则
  - AGENTS.md / CLAUDE.md 等 AI 入口文档的演进与一致性
  - SIG 治理自身的规则调整（本文件的修订）
  - 跨 SIG 议题的协调与决策升级路径

  不负责：
  - 具体命令实现（属于 sig/cli-ux）
  - API 端点对接（属于 sig/api）
  - 编码风格细节（属于 spec/foundations/coding-standards.md）

meeting:
  cadence: async
  notes: "Phase 1 试点期间使用带 sig/governance label 的 issue 异步记录（discussion 分类开通后迁移，见 sig-governance.md §6.2）；跨 SIG 议题由本 SIG 协调"
