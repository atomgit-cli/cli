# SIG: CLI UX
# 负责命令交互、--json 输出、错误提示、退出码、帮助文案的一致性
#
# note: 单人维护豁免期内（仓库 maintainer 总人数 < 2，lead 与 maintainer 暂时重叠）
#
# 真相源位置（评审通过后）：spec/governance/sigs/cli-ux.yaml
# 对应 label：sig/cli-ux
# 对应 discussion 分类：SIG: CLI UX

name: cli-ux
display_name: CLI User Experience
status: incubating
created_at: 2026-09-14

leads:
  - "@aflyingto"

maintainers:
  - "@aflyingto"

# 参与本 SIG 的 Agent 列表（详见 spec/governance/sig-governance.md §4.3）
agents:
  - id: claude-code
    operator: "@aflyingto"
    scopes: []          # 空列表表示授权整个 SIG 范围
    since: 2026-09-14
  - id: trae-ai
    operator: "@aflyingto"
    scopes: []
    since: 2026-09-14

scope:
  - pkg/cmd/
  - pkg/cmdutil/
  - pkg/output/
  - pkg/iostreams/

labels:
  - sig/cli-ux

discussion_category: "SIG: CLI UX"

charter: |
  负责 gc 命令对外的用户一致性体验：
  - 命令参数命名、flag 缩写、子命令结构的跨命令一致性
  - --json 输出字段命名、稳定性、与 API 模型的映射规则
  - 错误提示文案、退出码语义、非交互模式行为
  - --help 文案质量与示例完整性（对齐 spec/foundations/agent-friendly-cli.md）
  - cmdutil.Factory 与共享 I/O 抽象的演进

  不负责：
  - API 端点本身的语义（属于 sig/api）
  - 规范与文档治理（属于 sig/governance）
  - 单元测试覆盖率与门禁（属于 spec/foundations/，无需 SIG）

meeting:
  cadence: async
  notes: "使用 discussion 分类 'SIG: CLI UX' 异步记录"
