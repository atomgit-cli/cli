name: "gc"
arch: "arm64"
platform: "linux"
version: "0.14.0"
section: "default"
priority: "extra"
maintainer: "gitcode-cli contributors"
description: |
  GitCode CLI - Command line tool for GitCode
  Provides convenient access to GitCode features including:
  - Authentication management
  - Repository operations
  - Issue and PR management
vendor: "gitcode-cli"
homepage: "https://gitcode.com/gitcode-cli/cli"
license: "MIT"
scripts:
  postinstall: ./build/scripts/postinstall.sh
contents:
  - src: ./dist/gc_linux_arm64
    dst: /usr/bin/gc
  - src: /usr/bin/gc
    dst: /usr/bin/gitcode
    type: symlink
  - src: ./completions/gc.bash
    dst: /usr/share/bash-completion/completions/gc
  - src: ./build/completions/gitcode.bash
    dst: /usr/share/bash-completion/completions/gitcode
  - src: ./completions/gc.zsh
    dst: /usr/share/zsh/vendor-completions/_gc
  - src: ./build/completions/gitcode.zsh
    dst: /usr/share/zsh/vendor-completions/_gitcode
  - src: ./completions/gc.fish
    dst: /usr/share/fish/completions/gc.fish
  - src: ./build/completions/gitcode.fish
    dst: /usr/share/fish/completions/gitcode.fish
