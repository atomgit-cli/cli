# .goreleaser.yaml
# GitCode CLI Release Configuration

version: 2

project_name: gc

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: gc
    main: ./cmd/gc
    binary: gc
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    goarm:
      - "6"
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    overrides:
      - goos: darwin
        goarch: amd64
        ldflags:
          - -w
          - -X main.version={{.Version}}
          - -X main.commit={{.Commit}}
          - -X main.date={{.Date}}
      - goos: darwin
        goarch: arm64
        ldflags:
          - -w
          - -X main.version={{.Version}}
          - -X main.commit={{.Commit}}
          - -X main.date={{.Date}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - completions/*

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "merge conflict"
      - "Merge pull request"
      - "Merge remote-tracking branch"
      - "Merge branch"
  groups:
    - title: "New Features"
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: "Bug Fixes"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 10
    - title: "Documentation"
      regexp: "^.*docs[(\\w)]*:+.*$"
      order: 20
    - title: "Others"
      order: 999

brews:
  - name: gc
    repository:
      owner: atomgit-cli
      name: homebrew-tap
      branch: main
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: "chore: update gc formula for {{ .Tag }}"
    homepage: https://gitcode.com/atomgit-cli/cli
    description: GitCode CLI - Command line tool for GitCode
    license: MIT
    install: |
      bin.install "gc"
      bin.install_symlink "gc" => "gitcode"
      bash_completion.install "completions/gc.bash" => "gc"
      zsh_completion.install "completions/gc.zsh" => "_gc"
      fish_completion.install "completions/gc.fish"
    test: |
      assert_match "gc version", shell_output("#{bin}/gc version")
      assert_match "gitcode version", shell_output("#{bin}/gitcode version")

release:
  draft: false
  prerelease: auto
  mode: replace
  footer: |
    **Full Changelog**: https://gitcode.com/atomgit-cli/cli/compare/{{ .PreviousTag }}...{{ .Tag }}

announce:
  skip: false
  twitter:
    enabled: false
  slack:
    enabled: false
  discord:
    enabled: false
